<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>温故 · 可视化</title>
<style>
:root{--paper:#fffef9;--bg:#f3f2eb;--ink:#252d25;--muted:#73776b;--green:#243e31;--line:#dddfd4;--accent:#bed484;--serif:"Iowan Old Style","Songti SC","Noto Serif CJK SC",serif;--sans:"Avenir Next","PingFang SC","Microsoft YaHei",sans-serif}
@media (prefers-color-scheme:dark){:root{--paper:#1c231e;--bg:#141a16;--ink:#e3e8df;--muted:#9aa294;--green:#a9c98a;--line:#2f3a31;--accent:#55703c;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.75 var(--sans)}
a{color:var(--green);text-underline-offset:4px}
a:focus-visible{outline:3px solid #86a951;outline-offset:4px}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:28px 56px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px;font-size:12px;color:var(--muted)}
.eyebrow{font-size:10px;letter-spacing:2px;color:var(--muted);margin-top:28px}
h1{font:34px/1.3 var(--serif);font-weight:600;letter-spacing:2px;margin:6px 0 6px}
.lead{color:var(--muted);font-size:13px;margin:0 0 26px;max-width:62ch}
section{border-top:1px solid var(--line);padding:18px 0 8px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px}
@media (max-width:640px){section{grid-template-columns:minmax(0,1fr);gap:8px}}
section h2{font:18px var(--serif);font-weight:600;margin:4px 0}
section h2 span{display:block;font:11px var(--sans);color:var(--muted);font-weight:400}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{display:block;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:14px 16px}
.card:hover{border-color:var(--green)}
.card b{font:16px var(--serif);font-weight:600;display:block}
.card p{font-size:12px;color:var(--muted);margin:6px 0 8px;line-height:1.8}
.card small{font-size:11px;color:var(--muted)}
.none{font-size:12px;color:var(--muted);margin:6px 0}
.note{font-size:11px;color:var(--muted);margin-top:26px;border-top:1px solid var(--line);padding-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="../index.html">← 返回温故复习网站</a><span>六科可视化</span></div>
  <div class="eyebrow">VISUAL LAB</div>
  <h1>可视化</h1>
  <p class="lead">能动手点、能一步步播放的演示放在这里，按科目分栏。每个演示都对应一天的问答，结论以问答和教材为准，动画只帮助回忆。</p>
  <div id="list"><p class="none">正在读取演示目录…</p></div>
  <p class="note">新增演示：把页面放进 <code>演示/科目/</code>，再在 <code>演示/目录.json</code> 加一条。</p>
</div>
<script>
const SUBJ=[['高等数学','数学二'],['线性代数','数学二'],['数据结构','408'],['计算机组成原理','408'],['操作系统','408'],['计算机网络','408']];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('目录.json',{cache:'no-cache'}).then(r=>r.json()).then(items=>{
  document.getElementById('list').innerHTML=SUBJ.map(([s,g])=>{const own=items.filter(x=>x['科目']===s);
    return `<section id="${s}"><h2>${s}<span>${g} · ${own.length} 个演示</span></h2><div>${own.length?`<div class="cards">${own.map(x=>`<a class="card" href="${encodeURI(x['路径'])}"><b>${esc(x['标题'])}</b><p>${esc(x['说明'])}</p><small>${esc(x['日期'])}</small></a>`).join('')}</div>`:'<p class="none">还没有演示。</p>'}</div></section>`}).join('');
}).catch(()=>{document.getElementById('list').innerHTML='<p class="none">演示目录读取失败，请刷新重试。</p>'});
</script>
</body>
</html>
