name: Build and test study workspace
# 公开站点由 Cloudflare Pages 从 main 自动部署（https://wengu-408.pages.dev/，构建命令 python3 scripts/stage_pages.py，输出 _site）。
# 仓库改为私有后免费账号不能用 GitHub Pages，这里只做构建和测试。
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/build_site.py
      - run: python3 scripts/build_text.py
      - run: python3 -m unittest discover -s tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/spaced-review.test.cjs
      - run: python3 scripts/stage_pages.py
