name: Build and publish study workspace
# 两个公开地址同步更新：GitHub Pages（本 workflow 部署，https://ychenfen.github.io/claude-math-408-handoff/）
# 和 Cloudflare Pages（从 main 自动构建，https://wengu-408.pages.dev/，构建命令 python3 scripts/stage_pages.py，输出 _site）。
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: study-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/build_site.py
      - run: python3 scripts/build_text.py
      - run: python3 -m unittest discover -s tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/spaced-review.test.cjs
      - run: python3 scripts/stage_pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public site
        id: deployment
        uses: actions/deploy-pages@v4
