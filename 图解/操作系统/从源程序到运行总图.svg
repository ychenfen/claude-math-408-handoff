<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-label="从源程序到运行：编译、链接、装入，以及执行时的地址转换、保护、共享、请求调页" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="13"><title>从源程序到运行：编译、链接、装入，以及执行时的地址转换、保护、共享、请求调页</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b9183"/></marker></defs><rect width="760" height="470" fill="#fbfcf8"/><text x="20" y="30" font-size="15" fill="#252d25" font-weight="600" text-anchor="start">从源程序到运行：前三步决定“程序长什么样、放哪”，运行时 MMU 和操作系统接着管</text><rect x="20" y="52" width="140" height="52" rx="8" fill="#e9ece4" stroke="#8b9183" stroke-width="1.2"/><text x="90" y="74" font-size="13" fill="#252d25" font-weight="600" text-anchor="middle">源程序</text><text x="90" y="93" font-size="11.5" fill="#6b7163" text-anchor="middle">A.c、B.c</text><path d="M160 78H202" stroke="#8b9183" stroke-width="1.3" marker-end="url(#a)"/><text x="182" y="70" font-size="12" fill="#3f6b2c" font-weight="600" text-anchor="middle">编译</text><rect x="204" y="52" width="140" height="52" rx="8" fill="#e9ece4" stroke="#8b9183" stroke-width="1.2"/><text x="274" y="74" font-size="13" fill="#252d25" font-weight="600" text-anchor="middle">目标模块</text><text x="274" y="93" font-size="11.5" fill="#6b7163" text-anchor="middle">各自从 0 编址</text><path d="M344 78H386" stroke="#8b9183" stroke-width="1.3" marker-end="url(#a)"/><text x="366" y="70" font-size="12" fill="#3f6b2c" font-weight="600" text-anchor="middle">链接</text><rect x="388" y="52" width="140" height="52" rx="8" fill="#e9ece4" stroke="#8b9183" stroke-width="1.2"/><text x="458" y="74" font-size="13" fill="#252d25" font-weight="600" text-anchor="middle">装入模块</text><text x="458" y="93" font-size="11.5" fill="#6b7163" text-anchor="middle">完整逻辑地址空间</text><path d="M528 78H570" stroke="#8b9183" stroke-width="1.3" marker-end="url(#a)"/><text x="550" y="70" font-size="12" fill="#3f6b2c" font-weight="600" text-anchor="middle">装入</text><rect x="572" y="52" width="140" height="52" rx="8" fill="#e9ece4" stroke="#8b9183" stroke-width="1.2"/><text x="642" y="74" font-size="13" fill="#252d25" font-weight="600" text-anchor="middle">内存中的进程</text><text x="642" y="93" font-size="11.5" fill="#6b7163" text-anchor="middle">有了物理地址</text><text x="330" y="122" font-size="11.5" fill="#c07a1f" text-anchor="start">↑ 链接三种：静态／装入时／运行时</text><text x="470" y="140" font-size="11.5" fill="#2f5f9e" text-anchor="start">↑ 装入三种：绝对／静态重定位／动态重定位</text><path d="M712 78H744V168" fill="none" stroke="#8b9183" stroke-width="1.3" marker-end="url(#a)"/><text x="738" y="162" font-size="12" fill="#3f6b2c" font-weight="600" text-anchor="end">执行</text><rect x="20" y="172" width="720" height="236" rx="8" fill="#ffffff" stroke="#d6dacd" stroke-width="1.2"/><text x="32" y="194" font-size="13" fill="#252d25" font-weight="600" text-anchor="start">执行时每次访存都要经过的机制（都建立在“动态重定位 / 地址转换”之上）</text><rect x="32" y="208" width="344" height="88" rx="8" fill="#fbfcf8" stroke="#2f5f9e" stroke-width="1.5"/><text x="44" y="228" font-size="13" fill="#2f5f9e" font-weight="600" text-anchor="start">地址转换</text><text x="110" y="228" font-size="11.5" fill="#6b7163" text-anchor="start">逻辑地址 → 物理地址</text><text x="44" y="248" font-size="11.5" fill="#252d25" text-anchor="start">分区：+重定位寄存器</text><text x="44" y="265" font-size="11.5" fill="#252d25" text-anchor="start">分页：页表、快表 TLB</text><text x="44" y="282" font-size="11.5" fill="#252d25" text-anchor="start">连到 2009-46（TLB＋访存时间）</text><rect x="384" y="208" width="344" height="88" rx="8" fill="#fbfcf8" stroke="#b23b2e" stroke-width="1.5"/><text x="396" y="228" font-size="13" fill="#b23b2e" font-weight="600" text-anchor="start">保护</text><text x="434" y="228" font-size="11.5" fill="#6b7163" text-anchor="start">不许越界、不许乱写</text><text x="396" y="248" font-size="11.5" fill="#252d25" text-anchor="start">分区：界地址寄存器（2009-26）</text><text x="396" y="265" font-size="11.5" fill="#252d25" text-anchor="start">分页：页表项里的读/写权限位</text><text x="396" y="282" font-size="11.5" fill="#252d25" text-anchor="start">文件层面：FCB 里的存取控制（2009-30）</text><rect x="32" y="304" width="344" height="88" rx="8" fill="#fbfcf8" stroke="#c07a1f" stroke-width="1.5"/><text x="44" y="324" font-size="13" fill="#c07a1f" font-weight="600" text-anchor="start">共享</text><text x="82" y="324" font-size="11.5" fill="#6b7163" text-anchor="start">多个进程用同一份</text><text x="44" y="344" font-size="11.5" fill="#252d25" text-anchor="start">页表项／段表项指向同一块物理内存</text><text x="44" y="361" font-size="11.5" fill="#252d25" text-anchor="start">共享代码须是可重入代码</text><text x="44" y="378" font-size="11.5" fill="#252d25" text-anchor="start">动态链接的共享库靠的就是它</text><rect x="384" y="304" width="344" height="88" rx="8" fill="#fbfcf8" stroke="#3f6b2c" stroke-width="1.5"/><text x="396" y="324" font-size="13" fill="#3f6b2c" font-weight="600" text-anchor="start">请求调页与置换</text><text x="504" y="324" font-size="11.5" fill="#6b7163" text-anchor="start">用到才调入</text><text x="396" y="344" font-size="11.5" fill="#252d25" text-anchor="start">缺页中断 → 调页 → 重新执行指令</text><text x="396" y="361" font-size="11.5" fill="#252d25" text-anchor="start">内存满了按 LRU 等算法置换</text><text x="396" y="378" font-size="11.5" fill="#252d25" text-anchor="start">和“运行时动态链接”同一思路：局部性</text><text x="20" y="432" font-size="12" fill="#6b7163" text-anchor="start">跨章类比：硬链接共享 inode ≈ 页表项指向同一页框；软链接只存路径、用时按名字找 ≈ 动态链接的调用记录（2009-31）</text><text x="20" y="454" font-size="12.5" fill="#252d25" font-weight="600" text-anchor="start">一条主线：越“晚”确定（链接晚、地址转换晚、调页晚），越灵活、越省空间，代价是运行时多花时间、需要硬件（MMU）支持。</text></svg>