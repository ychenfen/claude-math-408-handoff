<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="写 y 的线程必须同时拿到 y1、y2 两把读锁" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="13"><title>写 y 的线程必须同时拿到 y1、y2 两把读锁</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b9183"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3f6b2c"/></marker></defs>
<rect x="20" y="30" width="140" height="48" rx="8" fill="#ffffff" stroke="#8b9183" stroke-width="1.25"/><text x="90.0" y="48.0" text-anchor="middle" font-weight="600" fill="#252d25">thread1</text><text x="90.0" y="67.0" text-anchor="middle" font-size="12" fill="#6b7163">读 y</text><rect x="20" y="112" width="140" height="48" rx="8" fill="#ffffff" stroke="#8b9183" stroke-width="1.25"/><text x="90.0" y="130.0" text-anchor="middle" font-weight="600" fill="#252d25">thread2</text><text x="90.0" y="149.0" text-anchor="middle" font-size="12" fill="#6b7163">读 y</text><rect x="20" y="194" width="140" height="48" rx="8" fill="#f3f6ec" stroke="#3f6b2c" stroke-width="2"/><text x="90.0" y="212.0" text-anchor="middle" font-weight="600" fill="#252d25">thread3</text><text x="90.0" y="231.0" text-anchor="middle" font-size="12" fill="#6b7163">写 y</text><rect x="260" y="30" width="120" height="48" rx="8" fill="#ffffff" stroke="#8b9183" stroke-width="1.25"/><text x="320.0" y="48.0" text-anchor="middle" font-weight="600" fill="#252d25">mutex_y1</text><text x="320.0" y="67.0" text-anchor="middle" font-size="12" fill="#6b7163">初值 1</text><rect x="260" y="112" width="120" height="48" rx="8" fill="#ffffff" stroke="#8b9183" stroke-width="1.25"/><text x="320.0" y="130.0" text-anchor="middle" font-weight="600" fill="#252d25">mutex_y2</text><text x="320.0" y="149.0" text-anchor="middle" font-size="12" fill="#6b7163">初值 1</text><rect x="480" y="92" width="140" height="64" rx="8" fill="#ffffff" stroke="#8b9183" stroke-width="1.25"/><text x="550.0" y="129.0" text-anchor="middle" font-weight="600" fill="#252d25">共享变量 y</text><path d="M160 54H258" fill="none" stroke="#8b9183" stroke-width="1.25" marker-end="url(#a)"/><text x="209" y="47" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7163">P(y1)</text><path d="M160 136H258" fill="none" stroke="#8b9183" stroke-width="1.25" marker-end="url(#a)"/><text x="209" y="129" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7163">P(y2)</text><path d="M380 54C430 54 440 108 478 112" fill="none" stroke="#8b9183" stroke-width="1.25" marker-end="url(#a)"/><path d="M380 136C430 136 440 132 478 130" fill="none" stroke="#8b9183" stroke-width="1.25" marker-end="url(#a)"/><path d="M160 210C210 210 220 70 258 64" fill="none" stroke="#3f6b2c" stroke-width="2" marker-end="url(#g)"/><path d="M160 222C220 222 230 150 258 146" fill="none" stroke="#3f6b2c" stroke-width="2" marker-end="url(#g)"/><text x="170" y="262" text-anchor="start" font-size="12" font-weight="600" fill="#3f6b2c">写者 P(y1)、P(y2) 都拿到才写，同时挡住两类读者</text><text x="480" y="190" text-anchor="start" font-size="12" font-weight="400" fill="#9a3b26">只拿 y1：thread2 仍可读，</text><text x="480" y="208" text-anchor="start" font-size="12" font-weight="400" fill="#9a3b26">读到写了一半的 y</text>
</svg>
