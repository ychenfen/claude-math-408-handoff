<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 712" role="img" aria-label="工具越往后越能让权等待，最后都落到用 PV 写同步互斥" font-size="13"><title>工具越往后越能让权等待，最后都落到用 PV 写同步互斥</title><style>svg{--cds-chart-axis:#8a8f98;--cds-text-primary:#1f2328;--cds-text-secondary:#5b616b;--cds-chart-categorical-1:#2f6fdb;--cds-chart-reference-tint:#eef0f3;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif}</style><defs><marker id="map-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="var(--cds-text-primary)">工具越往后越能让权等待，最后都落到用 PV 写同步互斥</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M380 88V104"></path><path d="M220 104H540"></path><path d="M220 104V120" marker-end="url(#map-arrow)"></path><path d="M540 104V120" marker-end="url(#map-arrow)"></path><path d="M220 176V192"></path><path d="M540 176V192"></path><path d="M220 192H540"></path><path d="M380 192V208" marker-end="url(#map-arrow)"></path><path d="M380 280V300"></path><path d="M88 300H672"></path><path d="M88 300V320" marker-end="url(#map-arrow)"></path><path d="M234 300V320" marker-end="url(#map-arrow)"></path><path d="M380 300V320" marker-end="url(#map-arrow)"></path><path d="M526 300V320" marker-end="url(#map-arrow)"></path><path d="M672 300V320" marker-end="url(#map-arrow)"></path><path d="M152 388H170" marker-end="url(#map-arrow)"></path><path d="M298 388H316" marker-end="url(#map-arrow)"></path><path d="M444 388H462" marker-end="url(#map-arrow)"></path><path d="M590 388H608" marker-end="url(#map-arrow)"></path><path d="M526 424V456" marker-end="url(#map-arrow)"></path><path d="M380 528V544"></path><path d="M137 544H623"></path><path d="M137 544V560" marker-end="url(#map-arrow)"></path><path d="M380 544V560" marker-end="url(#map-arrow)"></path><path d="M623 544V560" marker-end="url(#map-arrow)"></path><path d="M137 616V632"></path><path d="M380 616V632"></path><path d="M623 616V632"></path><path d="M137 632H623"></path><path d="M380 632V648" marker-end="url(#map-arrow)"></path></g><g><rect x="260" y="48" width="240" height="40" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="380" y="72" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">并发进程有异步性</text></g><g><rect x="80" y="120" width="280" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="220" y="144" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">同步：合作定先后次序</text><text x="220" y="162" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">直接制约 · 例：单缓冲送数据</text></g><g><rect x="400" y="120" width="280" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="540" y="144" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">互斥：抢同一临界资源</text><text x="540" y="162" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">间接制约 · 例：两进程抢打印机</text></g><g><rect x="160" y="208" width="440" height="72" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="380" y="232" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">两种关系都靠临界区管住</text><text x="380" y="250" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">进入区 → 临界区 → 退出区 → 剩余区</text><text x="380" y="267" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">四准则：空闲让进 · 忙则等待 · 有限等待 · 让权等待（非必须）</text></g><text x="390" y="294" font-size="11.5" fill="var(--cds-text-secondary)">实现手段</text><g><rect x="24" y="320" width="420" height="24" rx="6" fill="var(--cds-chart-reference-tint)"></rect><text x="234" y="336" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">忙等：都不满足让权等待</text></g><g><rect x="462" y="320" width="274" height="24" rx="6" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="599" y="336" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--cds-text-primary)">让权等待：进不去就阻塞</text></g><g><rect x="24" y="352" width="128" height="72" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="88" y="376" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">软件方法</text><text x="88" y="394" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">单标志 · 双标志</text><text x="88" y="410" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">Peterson</text></g><g><rect x="170" y="352" width="128" height="72" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="234" y="376" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">硬件方法</text><text x="234" y="394" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">关中断</text><text x="234" y="410" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">TS · Swap</text></g><g><rect x="316" y="352" width="128" height="72" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="380" y="376" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">互斥锁</text><text x="380" y="394" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">即自旋锁</text><text x="380" y="410" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">acquire/release</text></g><g><rect x="462" y="352" width="128" height="72" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="526" y="376" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">记录型信号量</text><text x="526" y="394" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">value + 队列 L</text><text x="526" y="410" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">P 阻塞 · V 唤醒</text></g><g><rect x="608" y="352" width="128" height="72" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="672" y="376" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">管程</text><text x="672" y="394" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">互斥自动保证</text><text x="672" y="410" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">条件变量做同步</text></g><text x="534" y="445" font-size="11.5" fill="var(--cds-text-secondary)">落到 PV</text><g><rect x="24" y="456" width="712" height="72" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="380" y="480" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">信号量三种用法：提供什么之后 V，要用什么之前 P</text><text x="380" y="498" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">互斥：初值 1，同一进程内 P、V 紧夹临界区</text><text x="380" y="515" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">同步：初值 0，先做者 V、后做者 P；前驱图每条边一个信号量，初值 0</text></g><g><rect x="24" y="560" width="226" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="137" y="584" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">生产者-消费者</text><text x="137" y="602" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">mutex + empty + full</text></g><g><rect x="267" y="560" width="226" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="380" y="584" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">读者-写者</text><text x="380" y="602" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">互斥计数器 count + rw</text></g><g><rect x="510" y="560" width="226" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="623" y="584" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">哲学家进餐</text><text x="623" y="602" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">限人数 · 一次拿两根 · 奇偶反向</text></g><g><rect x="200" y="648" width="360" height="40" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="380" y="672" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">统考大题：2009–2024 共 12 道（综合题 17–28）</text></g></svg>
