<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" role="img" aria-label="文件的访问控制信息存放在文件控制块里" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="13"><title>文件的访问控制信息存放在文件控制块里</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b9183"/></marker></defs>
<rect x="0" y="0" width="700" height="380" fill="#fbfcf8"/>
<text x="20" y="28" font-size="15" font-weight="600" fill="#252d25">2009-30 访问控制信息放在文件控制块（FCB）里</text>
<text x="95" y="60" text-anchor="middle" font-size="12" fill="#6b7163">目录（一项对应一个文件）</text>
<rect x="20" y="68" width="150" height="30" fill="#f3f6ec" stroke="#3f6b2c" stroke-width="2"/><text x="32" y="88" fill="#252d25">a.txt　→ FCB</text>
<rect x="20" y="98" width="150" height="30" fill="#ffffff" stroke="#8b9183"/><text x="32" y="118" fill="#6b7163">b.c　　→ FCB</text>
<rect x="20" y="128" width="150" height="30" fill="#ffffff" stroke="#8b9183"/><text x="32" y="148" fill="#6b7163">…</text>
<path d="M170 83H238" stroke="#3f6b2c" stroke-width="1.25" marker-end="url(#a)"/>
<text x="330" y="60" text-anchor="middle" font-size="12" fill="#6b7163">a.txt 的 FCB（Unix 叫 inode）</text>
<rect x="240" y="68" width="180" height="196" rx="8" fill="#ffffff" stroke="#8b9183" stroke-width="1.25"/>
<text x="254" y="92" fill="#252d25">文件名（Unix 放在目录项）</text>
<text x="254" y="118" fill="#252d25">类型、大小</text>
<text x="254" y="144" fill="#252d25">物理位置（盘块地址）</text>
<rect x="246" y="156" width="168" height="44" rx="6" fill="#f3f6ec" stroke="#3f6b2c" stroke-width="2"/><text x="254" y="175" font-weight="600" fill="#3f6b2c">存取控制信息</text><text x="254" y="193" font-size="12" fill="#3f6b2c">谁能读／写／执行（rwx）</text>
<text x="254" y="224" fill="#252d25">创建、修改时间</text>
<text x="254" y="250" fill="#6b7163">……</text>
<path d="M420 140H468" stroke="#8b9183" stroke-width="1.25" marker-end="url(#a)"/>
<text x="540" y="60" text-anchor="middle" font-size="12" fill="#6b7163">磁盘上的数据块</text>
<rect x="470" y="122" width="44" height="34" fill="#eef0ea" stroke="#8b9183"/><text x="492" y="144" text-anchor="middle" font-size="12" fill="#6b7163">5</text>
<rect x="518" y="122" width="44" height="34" fill="#eef0ea" stroke="#8b9183"/><text x="540" y="144" text-anchor="middle" font-size="12" fill="#6b7163">9</text>
<rect x="566" y="122" width="44" height="34" fill="#eef0ea" stroke="#8b9183"/><text x="588" y="144" text-anchor="middle" font-size="12" fill="#6b7163">12</text>
<rect x="470" y="186" width="200" height="62" rx="8" fill="#ffffff" stroke="#8b9183" stroke-dasharray="4 3"/><text x="480" y="206" font-size="12" fill="#252d25">文件分配表 FAT：只记</text><text x="480" y="223" font-size="12" fill="#252d25">“5 的下一块是 9”这种链接，</text><text x="480" y="240" font-size="12" fill="#b23b2e">不存权限 → 排除 B</text>
<text x="20" y="296" font-size="12.5" font-weight="600" fill="#252d25">open("a.txt", 写) 时：</text>
<text x="20" y="318" font-size="12.5" fill="#252d25">查目录找到 a.txt → 读它的 FCB → 用存取控制信息检查当前用户能不能写 → 能写才继续，否则拒绝。</text>
<text x="20" y="344" font-size="12.5" fill="#252d25">· 权限是“这个文件”的属性，所以跟着这个文件的 FCB 走；用户口令表、系统注册表都不是文件系统里</text>
<text x="20" y="364" font-size="12.5" fill="#252d25">　存放单个文件属性的地方。</text>
</svg>
