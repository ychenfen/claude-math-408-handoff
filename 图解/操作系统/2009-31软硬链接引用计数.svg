<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-label="软链接新建自己的 inode，硬链接给原 inode 计数加 1" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="13"><title>软链接新建自己的 inode，硬链接给原 inode 计数加 1</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b9183"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f5f9e"/></marker></defs>
<rect x="0" y="0" width="760" height="600" fill="#fbfcf8"/>
<text x="20" y="30" font-size="15" font-weight="600" fill="#252d25">2009-31 两个计数器：i1 归 F1/F3，i2 归软链接 F2</text>
<rect x="20" y="48" width="350" height="205" rx="10" fill="#ffffff" stroke="#d6dacd"/>
<text x="32" y="70" font-weight="600" fill="#252d25">① 开始</text>
<text x="40" y="92" font-size="11" fill="#6b7163">目录项</text><text x="220" y="92" font-size="11" fill="#6b7163">inode（计数记在这里）</text>
<rect x="220" y="100" width="135" height="56" rx="8" fill="#ffffff" stroke="#3f6b2c" stroke-width="1.25"/>
<text x="232" y="122" fill="#252d25">i1　F1 的数据</text><text x="232" y="144" font-weight="600" fill="#3f6b2c">计数 = 1</text>
<rect x="40" y="102" width="80" height="28" fill="#ffffff" stroke="#3f6b2c"/><text x="80" y="121" text-anchor="middle" fill="#252d25">F1</text>
<path d="M120 116C170 116 170 128 218 128" fill="none" stroke="#3f6b2c" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="390" y="48" width="350" height="205" rx="10" fill="#ffffff" stroke="#d6dacd"/>
<text x="402" y="70" font-weight="600" fill="#252d25">② 建软链接 F2：新文件，新 inode i2</text>
<text x="410" y="92" font-size="11" fill="#6b7163">目录项</text><text x="590" y="92" font-size="11" fill="#6b7163">inode（计数记在这里）</text>
<rect x="590" y="100" width="135" height="56" rx="8" fill="#ffffff" stroke="#3f6b2c" stroke-width="1.25"/>
<text x="602" y="122" fill="#252d25">i1　F1 的数据</text><text x="602" y="144" font-weight="600" fill="#3f6b2c">计数 = 1</text>
<rect x="590" y="176" width="135" height="56" rx="8" fill="#edf2fa" stroke="#2f5f9e" stroke-width="2"/>
<text x="602" y="198" fill="#252d25">i2　内容："F1"</text><text x="602" y="220" font-weight="600" fill="#2f5f9e">计数 = 1</text>
<rect x="410" y="102" width="80" height="28" fill="#ffffff" stroke="#3f6b2c"/><text x="450" y="121" text-anchor="middle" fill="#252d25">F1</text>
<path d="M490 116C540 116 540 128 588 128" fill="none" stroke="#3f6b2c" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="410" y="142" width="80" height="28" fill="#ffffff" stroke="#2f5f9e"/><text x="450" y="161" text-anchor="middle" fill="#252d25">F2</text>
<path d="M490 156C540 156 540 204 588 204" fill="none" stroke="#2f5f9e" stroke-width="1.5" marker-end="url(#a)"/>
<text x="410" y="245" font-size="11" fill="#6b7163">i2 ⇢ 按名字找 F1（不是目录项，不计数）</text>
<rect x="20" y="268" width="350" height="205" rx="10" fill="#ffffff" stroke="#d6dacd"/>
<text x="32" y="290" font-weight="600" fill="#252d25">③ 建硬链接 F3：新目录项指向 i1</text>
<text x="40" y="312" font-size="11" fill="#6b7163">目录项</text><text x="220" y="312" font-size="11" fill="#6b7163">inode（计数记在这里）</text>
<rect x="220" y="320" width="135" height="56" rx="8" fill="#f3f6ec" stroke="#3f6b2c" stroke-width="2"/>
<text x="232" y="342" fill="#252d25">i1　F1 的数据</text><text x="232" y="364" font-weight="600" fill="#3f6b2c">计数 = 2</text>
<rect x="220" y="396" width="135" height="56" rx="8" fill="#ffffff" stroke="#2f5f9e" stroke-width="1.25"/>
<text x="232" y="418" fill="#252d25">i2　内容："F1"</text><text x="232" y="440" font-weight="600" fill="#2f5f9e">计数 = 1</text>
<rect x="40" y="322" width="80" height="28" fill="#ffffff" stroke="#3f6b2c"/><text x="80" y="341" text-anchor="middle" fill="#252d25">F1</text>
<path d="M120 336C170 336 170 348 218 348" fill="none" stroke="#3f6b2c" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="362" width="80" height="28" fill="#ffffff" stroke="#2f5f9e"/><text x="80" y="381" text-anchor="middle" fill="#252d25">F2</text>
<path d="M120 376C170 376 170 424 218 424" fill="none" stroke="#2f5f9e" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="402" width="80" height="28" fill="#ffffff" stroke="#3f6b2c"/><text x="80" y="421" text-anchor="middle" fill="#252d25">F3</text>
<path d="M120 416C170 416 170 348 218 348" fill="none" stroke="#3f6b2c" stroke-width="1.5" marker-end="url(#a)"/>
<text x="40" y="465" font-size="11" fill="#6b7163">i2 ⇢ 按名字找 F1（不是目录项，不计数）</text>
<rect x="390" y="268" width="350" height="205" rx="10" fill="#ffffff" stroke="#d6dacd"/>
<text x="402" y="290" font-weight="600" fill="#252d25">④ 删除 F1：删目录项，i1 −1</text>
<text x="410" y="312" font-size="11" fill="#6b7163">目录项</text><text x="590" y="312" font-size="11" fill="#6b7163">inode（计数记在这里）</text>
<rect x="590" y="320" width="135" height="56" rx="8" fill="#f3f6ec" stroke="#3f6b2c" stroke-width="2"/>
<text x="602" y="342" fill="#252d25">i1　F1 的数据</text><text x="602" y="364" font-weight="600" fill="#3f6b2c">计数 = 1</text>
<rect x="590" y="396" width="135" height="56" rx="8" fill="#ffffff" stroke="#2f5f9e" stroke-width="1.25"/>
<text x="602" y="418" fill="#252d25">i2　内容："F1"</text><text x="602" y="440" font-weight="600" fill="#2f5f9e">计数 = 1</text>
<rect x="410" y="322" width="80" height="28" fill="#f3f3f1" stroke="#c9ccc4" stroke-dasharray="3 3"/><text x="450" y="341" text-anchor="middle" fill="#a9ada3" text-decoration="line-through">F1</text>
<rect x="410" y="362" width="80" height="28" fill="#ffffff" stroke="#2f5f9e"/><text x="450" y="381" text-anchor="middle" fill="#252d25">F2</text>
<path d="M490 376C540 376 540 424 588 424" fill="none" stroke="#2f5f9e" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="410" y="402" width="80" height="28" fill="#ffffff" stroke="#3f6b2c"/><text x="450" y="421" text-anchor="middle" fill="#252d25">F3</text>
<path d="M490 416C540 416 540 348 588 348" fill="none" stroke="#3f6b2c" stroke-width="1.5" marker-end="url(#a)"/>
<text x="410" y="465" font-size="11" fill="#b23b2e">i2 ⇢ 按名字找 F1 → 找不到（悬空）（不是目录项，不计数）</text>
<rect x="20" y="492" width="720" height="96" rx="10" fill="#fbecea" stroke="#b23b2e" stroke-width="1.25"/>
<text x="34" y="516" font-weight="600" fill="#b23b2e">你卡住的地方：把 i1、i2 当成同一个计数器</text>
<text x="34" y="540" fill="#252d25">· 硬链接 F3 的箭头指向 i1 → i1 的计数 +1（③ 里从 1 变 2）。</text>
<text x="34" y="560" fill="#252d25">· 软链接 F2 的箭头指向 i2 → i2 是新生的 inode，出生计数就是 1；i1 一点没变（② 里还是 1）。</text>
<text x="34" y="580" fill="#252d25">· 计数只数“实线箭头”（目录项）。“⇢ 按名字找”不算，所以删 F1 不影响 i2。答案：F2=1，F3=1。</text>
</svg>