<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img" aria-label="分区分配用界地址寄存器和基址寄存器保护内存" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="13"><title>分区分配用界地址寄存器和基址寄存器保护内存</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b9183"/></marker></defs>
<rect x="0" y="0" width="700" height="360" fill="#fbfcf8"/>
<text x="20" y="28" font-size="15" font-weight="600" fill="#252d25">2009-26 分区分配的保护：先比界地址，再加基址</text>
<rect x="20" y="70" width="130" height="52" rx="8" fill="#ffffff" stroke="#8b9183" stroke-width="1.25"/><text x="85" y="91" text-anchor="middle" font-weight="600" fill="#252d25">CPU 给出</text><text x="85" y="111" text-anchor="middle" fill="#6b7163">逻辑地址 L=346</text>
<path d="M150 96H188" stroke="#8b9183" stroke-width="1.25" marker-end="url(#a)"/>
<rect x="190" y="64" width="150" height="64" rx="8" fill="#f3f6ec" stroke="#3f6b2c" stroke-width="2"/><text x="265" y="88" text-anchor="middle" font-weight="600" fill="#252d25">L &lt; 界地址寄存器？</text><text x="265" y="110" text-anchor="middle" font-size="12" fill="#6b7163">界地址＝分区长度 3000</text>
<path d="M265 128V188" stroke="#b23b2e" stroke-width="1.25" marker-end="url(#a)"/><text x="273" y="162" font-size="12" fill="#b23b2e">否（越界）</text>
<rect x="190" y="190" width="150" height="52" rx="8" fill="#fbecea" stroke="#b23b2e" stroke-width="1.5"/><text x="265" y="211" text-anchor="middle" font-weight="600" fill="#b23b2e">产生越界中断</text><text x="265" y="231" text-anchor="middle" font-size="12" fill="#6b7163">交给操作系统处理</text>
<path d="M340 96H378" stroke="#3f6b2c" stroke-width="1.25" marker-end="url(#a)"/><text x="344" y="88" font-size="12" fill="#3f6b2c">是</text>
<rect x="380" y="64" width="150" height="64" rx="8" fill="#ffffff" stroke="#8b9183" stroke-width="1.25"/><text x="455" y="88" text-anchor="middle" font-weight="600" fill="#252d25">L ＋ 基址寄存器</text><text x="455" y="110" text-anchor="middle" font-size="12" fill="#6b7163">346＋14000＝14346</text>
<path d="M530 96H580" stroke="#8b9183" stroke-width="1.25" marker-end="url(#a)"/>
<text x="625" y="58" text-anchor="middle" font-size="12" fill="#6b7163">内存</text>
<rect x="582" y="66" width="86" height="40" fill="#eef0ea" stroke="#8b9183"/><text x="625" y="91" text-anchor="middle" font-size="12" fill="#6b7163">操作系统</text>
<rect x="582" y="106" width="86" height="40" fill="#eef0ea" stroke="#8b9183"/><text x="625" y="131" text-anchor="middle" font-size="12" fill="#6b7163">进程 A</text>
<rect x="582" y="146" width="86" height="80" fill="#f3f6ec" stroke="#3f6b2c" stroke-width="2"/><text x="625" y="182" text-anchor="middle" font-weight="600" fill="#252d25">进程 B</text><text x="625" y="200" text-anchor="middle" font-size="11" fill="#6b7163">只能访问这段</text>
<rect x="582" y="226" width="86" height="40" fill="#eef0ea" stroke="#8b9183"/><text x="625" y="251" text-anchor="middle" font-size="12" fill="#6b7163">进程 C</text>
<text x="576" y="150" text-anchor="end" font-size="11" fill="#3f6b2c">14000（基址）</text><text x="576" y="230" text-anchor="end" font-size="11" fill="#3f6b2c">16999</text>
<text x="20" y="290" font-size="12.5" fill="#252d25">· 两个寄存器圈住进程自己那一段连续内存；越界在“加基址之前”就被拦下。</text>
<text x="20" y="312" font-size="12.5" fill="#252d25">· 另一种做法：上、下界寄存器直接检查物理地址是否在 [14000, 16999] 内。</text>
<text x="20" y="334" font-size="12.5" fill="#252d25">· 这两个寄存器只能用特权指令修改，用户程序改不了，所以能起保护作用。</text>
</svg>
