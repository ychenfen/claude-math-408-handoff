<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Peterson 算法：连续申请：为什么不会饥饿" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="13"><title>Peterson 算法：连续申请：为什么不会饥饿</title><rect width="720" height="400" fill="#fbfcf8"/><text x="20" y="22" font-size="12" fill="#6b7163">Peterson 算法｜连续申请：为什么不会饥饿｜第 6 步</text><text x="20" y="46" font-size="15" font-weight="600" fill="#252d25">P1 检查：flag[0]=T 且 turn==0？turn 是 1 → 假，P1 进入</text><rect x="20" y="62" width="230" height="212" rx="8" fill="#ffffff" stroke="#2f5f9e" stroke-width="1.5"/><text x="32" y="84" font-weight="600" fill="#2f5f9e">P0</text><text x="36" y="113" font-size="11.5" font-family="Menlo,Consolas,monospace" fill="#252d25">  flag[0] = TRUE;</text><text x="36" y="142" font-size="11.5" font-family="Menlo,Consolas,monospace" fill="#252d25">  turn = 1;</text><rect x="26" y="154" width="218" height="25" rx="4" fill="#e3ecf8" stroke="#2f5f9e"/><text x="36" y="171" font-size="11.5" font-family="Menlo,Consolas,monospace" fill="#252d25" font-weight="700">▶ while(flag[1] &amp;&amp; turn==1);</text><text x="36" y="200" font-size="11.5" font-family="Menlo,Consolas,monospace" fill="#6b7163">  临界区</text><text x="36" y="229" font-size="11.5" font-family="Menlo,Consolas,monospace" fill="#252d25">  flag[0] = FALSE;</text><text x="36" y="258" font-size="11.5" font-family="Menlo,Consolas,monospace" fill="#6b7163">  剩余区</text><text x="238" y="84" text-anchor="end" font-size="12" font-weight="700" fill="#b23b2e">↻ 在 while 里空转</text><rect x="470" y="62" width="230" height="212" rx="8" fill="#ffffff" stroke="#c07a1f" stroke-width="1.5"/><text x="482" y="84" font-weight="600" fill="#c07a1f">P1</text><text x="486" y="113" font-size="11.5" font-family="Menlo,Consolas,monospace" fill="#252d25">  flag[1] = TRUE;</text><text x="486" y="142" font-size="11.5" font-family="Menlo,Consolas,monospace" fill="#252d25">  turn = 0;</text><text x="486" y="171" font-size="11.5" font-family="Menlo,Consolas,monospace" fill="#252d25">  while(flag[0] &amp;&amp; turn==0);</text><rect x="476" y="183" width="218" height="25" rx="4" fill="#f8ead6" stroke="#c07a1f"/><text x="486" y="200" font-size="11.5" font-family="Menlo,Consolas,monospace" fill="#6b7163" font-weight="700">▶ 临界区</text><text x="486" y="229" font-size="11.5" font-family="Menlo,Consolas,monospace" fill="#252d25">  flag[1] = FALSE;</text><text x="486" y="258" font-size="11.5" font-family="Menlo,Consolas,monospace" fill="#6b7163">  剩余区</text><text x="360" y="78" text-anchor="middle" font-size="12" font-weight="600" fill="#6b7163">共享变量</text><rect x="275" y="88" width="170" height="32" rx="6" fill="#ffffff" stroke="#8b9183" stroke-width="1"/><text x="287" y="109" font-family="Menlo,Consolas,monospace" fill="#252d25">flag[0]</text><text x="433" y="109" text-anchor="end" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#3f6b2c">TRUE</text><rect x="275" y="128" width="170" height="32" rx="6" fill="#ffffff" stroke="#8b9183" stroke-width="1"/><text x="287" y="149" font-family="Menlo,Consolas,monospace" fill="#252d25">flag[1]</text><text x="433" y="149" text-anchor="end" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#3f6b2c">TRUE</text><rect x="275" y="168" width="170" height="32" rx="6" fill="#ffffff" stroke="#8b9183" stroke-width="1"/><text x="287" y="189" font-family="Menlo,Consolas,monospace" fill="#252d25">turn</text><text x="433" y="189" text-anchor="end" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#c07a1f">1</text><rect x="275" y="214" width="170" height="60" rx="8" fill="#eaf2e2" stroke="#3f6b2c" stroke-width="2" stroke-dasharray=""/><text x="360" y="236" text-anchor="middle" font-size="12" fill="#6b7163">临界区</text><text x="360" y="260" text-anchor="middle" font-size="16" font-weight="700" fill="#c07a1f">P1</text><text x="20" y="304" font-size="13" fill="#252d25">P1 最多等对方一轮就能进 → 有限等待，不会饥饿 ✓</text><text x="20" y="386" font-size="11.5" fill="#6b7163">黄色＝这一步刚改的变量；▶＝当前执行的语句；↻＝在 while 里空转（忙等）。代码按记忆整理，以真题册为准。</text></svg>