<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 620" role="img" aria-label="链接管怎么拼，装入管放哪里：三种链接与三种装入对比" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="13"><title>链接管怎么拼，装入管放哪里：三种链接与三种装入对比</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b9183"/></marker></defs><rect width="740" height="620" fill="#fbfcf8"/><text x="20" y="30" font-size="15" fill="#252d25" font-weight="600" text-anchor="start">同一个例子：A 调用 B。链接管“怎么拼成一个整体”，装入管“放进内存哪里”</text><rect x="20" y="48" width="720" height="58" rx="8" fill="#ffffff" stroke="#d6dacd" stroke-width="1.2"/><text x="32" y="70" font-size="12" fill="#6b7163" font-weight="600" text-anchor="start">编译后</text><rect x="90" y="58" width="190" height="38" rx="8" fill="#e9ece4" stroke="#8b9183" stroke-width="1.2"/><text x="100" y="82" font-size="12" fill="#252d25" text-anchor="start">模块 A：地址 0～199，含 call B</text><rect x="300" y="58" width="150" height="38" rx="8" fill="#e9ece4" stroke="#8b9183" stroke-width="1.2"/><text x="310" y="82" font-size="12" fill="#252d25" text-anchor="start">模块 B：地址 0～99</text><text x="468" y="76" font-size="12" fill="#6b7163" text-anchor="start">每个目标模块都从 0 开始编址，</text><text x="468" y="94" font-size="12" fill="#6b7163" text-anchor="start">A 还不知道 B 在哪（外部引用）</text><text x="20" y="132" font-size="14" fill="#c07a1f" font-weight="600" text-anchor="start">链接：把 A、B（和库）拼成一个装入模块</text><text x="20" y="150" font-size="12" fill="#6b7163" text-anchor="start">区别在“什么时候拼”</text><rect x="20" y="160" width="232" height="178" rx="8" fill="#ffffff" stroke="#c07a1f" stroke-width="1.5"/><text x="32" y="182" font-size="13" fill="#c07a1f" font-weight="600" text-anchor="start">① 静态链接</text><text x="32" y="200" font-size="11.5" fill="#6b7163" text-anchor="start">时机：运行之前，一次拼好</text><text x="32" y="224" font-size="12" fill="#252d25" text-anchor="start">A 放 0～199，B 接在 200～299</text><text x="32" y="242" font-size="12" fill="#252d25" text-anchor="start">call B 改成 call 200</text><text x="32" y="260" font-size="12" fill="#252d25" text-anchor="start">库函数也整个拷进来</text><line x1="32" y1="280" x2="240" y2="280" stroke="#d6dacd"/><text x="32" y="298" font-size="11.5" fill="#6b7163" text-anchor="start">拼好后不再拆开；改一个模块</text><text x="32" y="315" font-size="11.5" fill="#6b7163" text-anchor="start">要重新链接；每个程序各带一份库</text><rect x="264" y="160" width="232" height="178" rx="8" fill="#ffffff" stroke="#c07a1f" stroke-width="1.5"/><text x="276" y="182" font-size="13" fill="#c07a1f" font-weight="600" text-anchor="start">② 装入时动态链接</text><text x="276" y="200" font-size="11.5" fill="#6b7163" text-anchor="start">时机：装入内存时，边装边拼</text><text x="276" y="224" font-size="12" fill="#252d25" text-anchor="start">装入 A 时发现要用 B，</text><text x="276" y="242" font-size="12" fill="#252d25" text-anchor="start">把 B 一起装入并改好 call 地址</text><text x="276" y="260" font-size="12" fill="#252d25" text-anchor="start">磁盘上 A、B 仍分开存放</text><line x1="276" y1="280" x2="484" y2="280" stroke="#d6dacd"/><text x="276" y="298" font-size="11.5" fill="#6b7163" text-anchor="start">模块独立，便于修改、升级；</text><text x="276" y="315" font-size="11.5" fill="#6b7163" text-anchor="start">也便于共享</text><rect x="508" y="160" width="232" height="178" rx="8" fill="#ffffff" stroke="#c07a1f" stroke-width="1.5"/><text x="520" y="182" font-size="13" fill="#c07a1f" font-weight="600" text-anchor="start">③ 运行时动态链接</text><text x="520" y="200" font-size="11.5" fill="#6b7163" text-anchor="start">时机：执行到 call B 那一刻</text><text x="520" y="224" font-size="12" fill="#252d25" text-anchor="start">装入时只装 A</text><text x="520" y="242" font-size="12" fill="#252d25" text-anchor="start">执行到 call B 才去找 B、装入、链接</text><text x="520" y="260" font-size="12" fill="#252d25" text-anchor="start">一直没调用到的模块就不装</text><line x1="520" y1="280" x2="728" y2="280" stroke="#d6dacd"/><text x="520" y="298" font-size="11.5" fill="#6b7163" text-anchor="start">装入快、省内存；</text><text x="520" y="315" font-size="11.5" fill="#6b7163" text-anchor="start">首次调用要多花时间（今天的题）</text><text x="20" y="372" font-size="14" fill="#2f5f9e" font-weight="600" text-anchor="start">装入：把装入模块（逻辑地址 0～299）放到内存 1000 开始的位置</text><text x="20" y="390" font-size="12" fill="#6b7163" text-anchor="start">区别在“逻辑地址什么时候换成物理地址”</text><rect x="20" y="400" width="232" height="178" rx="8" fill="#ffffff" stroke="#2f5f9e" stroke-width="1.5"/><text x="32" y="422" font-size="13" fill="#2f5f9e" font-weight="600" text-anchor="start">① 绝对装入</text><text x="32" y="440" font-size="11.5" fill="#6b7163" text-anchor="start">时机：编译时就定死</text><text x="32" y="464" font-size="12" fill="#252d25" text-anchor="start">编译时就知道放在 1000</text><text x="32" y="482" font-size="12" fill="#252d25" text-anchor="start">程序里直接写 1000～1299</text><text x="32" y="500" font-size="12" fill="#252d25" text-anchor="start">call 写成 call 1200</text><line x1="32" y1="520" x2="240" y2="520" stroke="#d6dacd"/><text x="32" y="538" font-size="11.5" fill="#6b7163" text-anchor="start">只适合单道程序；</text><text x="32" y="555" font-size="11.5" fill="#6b7163" text-anchor="start">换个位置就得重新编译</text><rect x="264" y="400" width="232" height="178" rx="8" fill="#ffffff" stroke="#2f5f9e" stroke-width="1.5"/><text x="276" y="422" font-size="13" fill="#2f5f9e" font-weight="600" text-anchor="start">② 可重定位装入</text><text x="276" y="440" font-size="11.5" fill="#6b7163" text-anchor="start">＝ 静态重定位：装入时一次改好</text><text x="276" y="464" font-size="12" fill="#252d25" text-anchor="start">装入时把所有地址都 +1000</text><text x="276" y="482" font-size="12" fill="#252d25" text-anchor="start">call 200 → call 1200</text><text x="276" y="500" font-size="12" fill="#252d25" text-anchor="start">改完就不再变</text><line x1="276" y1="520" x2="484" y2="520" stroke="#d6dacd"/><text x="276" y="538" font-size="11.5" fill="#6b7163" text-anchor="start">要一次分到全部所需的连续内存；</text><text x="276" y="555" font-size="11.5" fill="#6b7163" text-anchor="start">运行中不能再移动</text><rect x="508" y="400" width="232" height="178" rx="8" fill="#ffffff" stroke="#2f5f9e" stroke-width="1.5"/><text x="520" y="422" font-size="13" fill="#2f5f9e" font-weight="600" text-anchor="start">③ 动态运行时装入</text><text x="520" y="440" font-size="11.5" fill="#6b7163" text-anchor="start">＝ 动态重定位：执行时才换</text><text x="520" y="464" font-size="12" fill="#252d25" text-anchor="start">内存里仍是 0～299、call 200</text><text x="520" y="482" font-size="12" fill="#252d25" text-anchor="start">每次访问：物理＝逻辑＋1000</text><text x="520" y="500" font-size="12" fill="#252d25" text-anchor="start">（1000 存在重定位寄存器里）</text><line x1="520" y1="520" x2="728" y2="520" stroke="#d6dacd"/><text x="520" y="538" font-size="11.5" fill="#6b7163" text-anchor="start">能搬家（对换、紧凑）；配合界地址</text><text x="520" y="555" font-size="11.5" fill="#6b7163" text-anchor="start">寄存器做保护（2009-26）</text><text x="20" y="604" font-size="12.5" fill="#b23b2e" font-weight="600" text-anchor="start">易混：“动态链接”的“动态”说的是库什么时候接进来；“动态重定位”的“动态”说的是地址什么时候换成物理地址，两者不是一回事。</text></svg>