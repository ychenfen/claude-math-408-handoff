<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" role="img" aria-label="HTTP 四种方式取 1 个网页和 3 张小图所需 RTT：非持续串行 8，非持续并行 4，持续非流水 5，持续流水 3" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="13"><title>HTTP 四种方式的 RTT 数对比</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#333"/></marker></defs>
<text x="250" y="40" fill="#252d25" font-weight="600">每格 = 1 个 RTT（灰：建 TCP 连接；蓝：HTTP 请求 + 响应）</text><text x="720" y="40" fill="#252d25" font-weight="600">合计</text><text x="790" y="40" fill="#252d25" font-weight="600">n 张图</text>
<text x="238" y="94" text-anchor="end" fill="#252d25">HTTP/1.0 非持续、不并行</text>
<rect x="250" y="70" width="56" height="36" fill="#e2e2e2" stroke="#555"/><text x="278.0" y="93" text-anchor="middle" fill="#252d25" font-size="12">建</text>
<rect x="306" y="70" width="56" height="36" fill="#cfe0f3" stroke="#555"/><text x="334.0" y="93" text-anchor="middle" fill="#252d25" font-size="12">页</text>
<rect x="362" y="70" width="56" height="36" fill="#e2e2e2" stroke="#555"/><text x="390.0" y="93" text-anchor="middle" fill="#252d25" font-size="12">建</text>
<rect x="418" y="70" width="56" height="36" fill="#cfe0f3" stroke="#555"/><text x="446.0" y="93" text-anchor="middle" fill="#252d25" font-size="12">图1</text>
<rect x="474" y="70" width="56" height="36" fill="#e2e2e2" stroke="#555"/><text x="502.0" y="93" text-anchor="middle" fill="#252d25" font-size="12">建</text>
<rect x="530" y="70" width="56" height="36" fill="#cfe0f3" stroke="#555"/><text x="558.0" y="93" text-anchor="middle" fill="#252d25" font-size="12">图2</text>
<rect x="586" y="70" width="56" height="36" fill="#e2e2e2" stroke="#555"/><text x="614.0" y="93" text-anchor="middle" fill="#252d25" font-size="12">建</text>
<rect x="642" y="70" width="56" height="36" fill="#cfe0f3" stroke="#555"/><text x="670.0" y="93" text-anchor="middle" fill="#252d25" font-size="12">图3</text>
<text x="730" y="94" text-anchor="middle" fill="#252d25" font-weight="600">8</text><text x="805" y="94" text-anchor="middle" fill="#2f5520">2(n + 1)</text>
<text x="238" y="150" text-anchor="end" fill="#252d25">HTTP/1.0 非持续、并行</text>
<rect x="250" y="126" width="56" height="36" fill="#e2e2e2" stroke="#555"/><text x="278.0" y="149" text-anchor="middle" fill="#252d25" font-size="12">建</text>
<rect x="306" y="126" width="56" height="36" fill="#cfe0f3" stroke="#555"/><text x="334.0" y="149" text-anchor="middle" fill="#252d25" font-size="12">页</text>
<rect x="362" y="126" width="56" height="36" fill="#e2e2e2" stroke="#555"/><text x="390.0" y="149" text-anchor="middle" fill="#252d25" font-size="12">建×3</text>
<rect x="418" y="126" width="56" height="36" fill="#cfe0f3" stroke="#555"/><text x="446.0" y="149" text-anchor="middle" fill="#252d25" font-size="12">图×3</text>
<text x="730" y="150" text-anchor="middle" fill="#252d25" font-weight="600">4</text><text x="805" y="150" text-anchor="middle" fill="#2f5520">4</text>
<text x="238" y="206" text-anchor="end" fill="#252d25">HTTP/1.1 持续、非流水</text>
<rect x="250" y="182" width="56" height="36" fill="#e2e2e2" stroke="#555"/><text x="278.0" y="205" text-anchor="middle" fill="#252d25" font-size="12">建</text>
<rect x="306" y="182" width="56" height="36" fill="#cfe0f3" stroke="#555"/><text x="334.0" y="205" text-anchor="middle" fill="#252d25" font-size="12">页</text>
<rect x="362" y="182" width="56" height="36" fill="#cfe0f3" stroke="#555"/><text x="390.0" y="205" text-anchor="middle" fill="#252d25" font-size="12">图1</text>
<rect x="418" y="182" width="56" height="36" fill="#cfe0f3" stroke="#555"/><text x="446.0" y="205" text-anchor="middle" fill="#252d25" font-size="12">图2</text>
<rect x="474" y="182" width="56" height="36" fill="#cfe0f3" stroke="#555"/><text x="502.0" y="205" text-anchor="middle" fill="#252d25" font-size="12">图3</text>
<text x="730" y="206" text-anchor="middle" fill="#252d25" font-weight="600">5</text><text x="805" y="206" text-anchor="middle" fill="#2f5520">n + 2</text>
<text x="238" y="262" text-anchor="end" fill="#252d25">HTTP/1.1 持续、流水</text>
<rect x="250" y="238" width="56" height="36" fill="#e2e2e2" stroke="#555"/><text x="278.0" y="261" text-anchor="middle" fill="#252d25" font-size="12">建</text>
<rect x="306" y="238" width="56" height="36" fill="#cfe0f3" stroke="#555"/><text x="334.0" y="261" text-anchor="middle" fill="#252d25" font-size="12">页</text>
<rect x="362" y="238" width="56" height="36" fill="#cfe0f3" stroke="#555"/><text x="390.0" y="261" text-anchor="middle" fill="#252d25" font-size="12">图1～3</text>
<text x="730" y="262" text-anchor="middle" fill="#252d25" font-weight="600">3</text><text x="805" y="262" text-anchor="middle" fill="#2f5520">3</text>
<text x="20" y="320" fill="#252d25">例：网页引用同一服务器上 3 张很小的图（讲解视频的例子），忽略发送时延，从建连开始到收完全部内容。</text>
<text x="20" y="344" fill="#252d25">“非持续”：每个对象都要新建一条 TCP 连接；下一条不用等上一条释放完（不等 2MSL），这仍然算“不并行”。</text>
<text x="20" y="368" fill="#252d25">“流水”：拿到网页后把所有图片请求连着发，响应连着回，合起来只占 1 个 RTT。</text>
<text x="20" y="400" fill="#252d25" font-weight="600">2024-40：1 个网页 + 7 张图，非持续、不并行 → 2 × 8 = 16 个 RTT。</text>
</svg>
