<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" aria-label="802.11 信道预约时序：DIFS、RTS、SIFS、CTS、SIFS、DATA、SIFS、ACK，以及 RTS、CTS、数据帧中的 NAV 各覆盖哪一段" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="13"><title>802.11 RTS/CTS 信道预约与 NAV</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#333"/></marker></defs>
<text x="20" y="96" fill="#252d25" font-weight="600">A（发送）</text><text x="20" y="156" fill="#252d25" font-weight="600">AP</text>
<path d="M110 110H800M110 170H800" stroke="#999"/>
<text x="145.0" y="66" text-anchor="middle" fill="#666" font-size="12">DIFS</text><path d="M110 70V180M180 70V180" stroke="#bbb" stroke-dasharray="3 3"/>
<rect x="180" y="78" width="60" height="32" fill="#cfe0f3" stroke="#555"/><text x="210.0" y="99" text-anchor="middle" fill="#252d25" font-weight="600">RTS</text>
<text x="257.0" y="66" text-anchor="middle" fill="#666" font-size="12">SIFS</text><path d="M240 70V180M274 70V180" stroke="#bbb" stroke-dasharray="3 3"/>
<rect x="274" y="138" width="56" height="32" fill="#f3d9bf" stroke="#555"/><text x="302.0" y="159" text-anchor="middle" fill="#252d25" font-weight="600">CTS</text>
<text x="347.0" y="66" text-anchor="middle" fill="#666" font-size="12">SIFS</text><path d="M330 70V180M364 70V180" stroke="#bbb" stroke-dasharray="3 3"/>
<rect x="364" y="78" width="250" height="32" fill="#cfe0f3" stroke="#555"/><text x="489.0" y="99" text-anchor="middle" fill="#252d25" font-weight="600">DATA</text>
<text x="631.0" y="66" text-anchor="middle" fill="#666" font-size="12">SIFS</text><path d="M614 70V180M648 70V180" stroke="#bbb" stroke-dasharray="3 3"/>
<rect x="648" y="138" width="56" height="32" fill="#f3d9bf" stroke="#555"/><text x="676.0" y="159" text-anchor="middle" fill="#252d25" font-weight="600">ACK</text>
<rect x="240" y="203" width="464" height="20" fill="#e3f0d8" stroke="#6a9a4f"/><text x="472.0" y="218" text-anchor="middle" fill="#2f5520" font-size="12">SIFS + CTS + SIFS + DATA + SIFS + ACK</text>
<text x="234" y="218" text-anchor="end" fill="#252d25" font-size="12">RTS 中的 NAV（A 写，C 等邻站照设）</text>
<rect x="330" y="243" width="374" height="20" fill="#e3f0d8" stroke="#6a9a4f"/><text x="517.0" y="258" text-anchor="middle" fill="#2f5520" font-size="12">SIFS + DATA + SIFS + ACK</text>
<text x="324" y="258" text-anchor="end" fill="#252d25" font-size="12">CTS 中的 NAV（AP 写，隐蔽站 B 照设）</text>
<rect x="614" y="283" width="90" height="20" fill="#e3f0d8" stroke="#6a9a4f"/><text x="659.0" y="298" text-anchor="middle" fill="#2f5520" font-size="12">SIFS + ACK</text>
<text x="608" y="298" text-anchor="end" fill="#252d25" font-size="12">DATA 中的 NAV（没听到前两帧的站）</text>
<text x="20" y="352" fill="#252d25" font-weight="600">规则：某帧里的 NAV = 这一帧发完以后，一直到 ACK 发完为止的全部时间。</text>
<text x="20" y="374" fill="#252d25">不含这一帧自己，也不含开头的 DIFS；传播时延忽略。图中宽度不按比例。</text>
<text x="20" y="400" fill="#252d25">2024-36：B 收到 CTS → NAV = SIFS + DATA + SIFS + ACK = 28 + 296 + 28 + 2 = 354μs（DATA = 1998B × 8 ÷ 54Mb/s ≈ 296μs）。</text>
<text x="20" y="424" fill="#666" font-size="12">控制帧长度（讲解视频）：RTS 20B，CTS 14B，ACK 14B。</text>
</svg>
