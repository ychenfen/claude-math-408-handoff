<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="最坏情况下冲突信号要 2τ 才回到发送方，所以帧的发送时间至少 2τ" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="13"><title>最坏情况下冲突信号要 2τ 才回到发送方，所以帧的发送时间至少 2τ</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b9183"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3f6b2c"/></marker></defs>
<text x="120" y="36" text-anchor="middle" font-size="13" font-weight="600" fill="#252d25">站 A</text><text x="520" y="36" text-anchor="middle" font-size="13" font-weight="600" fill="#252d25">站 B</text><path d="M120 46V300" fill="none" stroke="#8b9183" stroke-width="1" marker-end="url(#a)"/><path d="M520 46V300" fill="none" stroke="#8b9183" stroke-width="1" marker-end="url(#a)"/><text x="534" y="298" text-anchor="start" font-size="12" font-weight="400" fill="#6b7163">时间</text><rect x="113" y="60" width="14" height="196" rx="3" fill="#f3f6ec" stroke="#3f6b2c" stroke-width="2"/><path d="M128 60L518 153" fill="none" stroke="#3f6b2c" stroke-width="1.5" marker-end="url(#g)"/><text x="350.0" y="97.5" text-anchor="start" font-size="12" font-weight="400" fill="#3f6b2c">A 的信号传到 B 用 τ</text><path d="M518 151L130 250" fill="none" stroke="#9a3b26" stroke-width="1.5" marker-end="url(#a)"/><text x="360.0" y="185" text-anchor="middle" font-size="12" font-weight="400" fill="#9a3b26">B 刚要发就冲突，冲突信号回到 A 又用 τ</text><path d="M96 60H110" fill="none" stroke="#8b9183" stroke-width="1"/><text x="90" y="64" text-anchor="end" font-size="13" font-weight="600" fill="#252d25">0</text><path d="M96 155H110" fill="none" stroke="#8b9183" stroke-width="1"/><text x="90" y="159" text-anchor="end" font-size="13" font-weight="600" fill="#252d25">τ</text><path d="M96 250H110" fill="none" stroke="#8b9183" stroke-width="1"/><text x="90" y="254" text-anchor="end" font-size="13" font-weight="600" fill="#252d25">2τ</text><text x="140" y="276" text-anchor="start" font-size="12" font-weight="600" fill="#3f6b2c">到 2τ 时 A 必须仍在发送，才能发现冲突</text><text x="330" y="302" text-anchor="middle" font-size="14" font-weight="600" fill="#252d25">发送时间 ≥ 2τ  ⇒  最短帧长 L = 2τ × R</text>
</svg>
