<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-label="BGP 选路四条规则按顺序比较：本地偏好高、AS 跳数少、热土豆离出口近、BGP 标识符小" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="13"><title>BGP 选路四条规则</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#333"/></marker></defs>
<rect x="20" y="40" width="190" height="150" rx="8" fill="#f6f5ef" stroke="#6c7166"/><text x="115" y="68" text-anchor="middle" fill="#252d25" font-weight="600" font-size="15">① 本地偏好</text><text x="115" y="100" text-anchor="middle" fill="#252d25" font-size="12">local preference 高的优先</text><text x="115" y="126" text-anchor="middle" fill="#6c7166" font-size="12">管理员设，经 iBGP 告诉全 AS</text><text x="115" y="152" text-anchor="middle" fill="#6c7166" font-size="12">题说“无策略约束”就跳过</text><path d="M212 115H232" stroke="#333" marker-end="url(#a)"/><text x="222" y="106" text-anchor="middle" fill="#6c7166" font-size="11">打平</text>
<rect x="232" y="40" width="190" height="150" rx="8" fill="#eef3dc" stroke="#6c7166"/><text x="327" y="68" text-anchor="middle" fill="#252d25" font-weight="600" font-size="15">② AS 跳数</text><text x="327" y="100" text-anchor="middle" fill="#252d25" font-size="12">AS 路径经过的 AS 少的优先</text><text x="327" y="126" text-anchor="middle" fill="#6c7166" font-size="12">只数 AS 个数，不管 AS 多大</text><path d="M424 115H444" stroke="#333" marker-end="url(#a)"/><text x="434" y="106" text-anchor="middle" fill="#6c7166" font-size="11">打平</text>
<rect x="444" y="40" width="190" height="150" rx="8" fill="#eef3dc" stroke="#6c7166"/><text x="539" y="68" text-anchor="middle" fill="#252d25" font-weight="600" font-size="15">③ 热土豆</text><text x="539" y="100" text-anchor="middle" fill="#252d25" font-size="12">AS 内离出口近的优先</text><text x="539" y="126" text-anchor="middle" fill="#6c7166" font-size="12">按 IGP 算（RIP 看跳数）</text><text x="539" y="152" text-anchor="middle" fill="#6c7166" font-size="12">每台路由器各算各的</text><path d="M636 115H656" stroke="#333" marker-end="url(#a)"/><text x="646" y="106" text-anchor="middle" fill="#6c7166" font-size="11">打平</text>
<rect x="656" y="40" width="190" height="150" rx="8" fill="#f6f5ef" stroke="#6c7166"/><text x="751" y="68" text-anchor="middle" fill="#252d25" font-weight="600" font-size="15">④ BGP 标识符</text><text x="751" y="100" text-anchor="middle" fill="#252d25" font-size="12">BGP ID 小的优先</text><text x="751" y="126" text-anchor="middle" fill="#6c7166" font-size="12">32 位，取最大接口 IP</text><text x="751" y="152" text-anchor="middle" fill="#6c7166" font-size="12">在 OPEN 报文里交换</text>
<text x="20" y="28" fill="#252d25" font-weight="600">按顺序比，前一条分出胜负就停</text>
<text x="20" y="226" fill="#252d25" font-weight="600">2024-47(5)（无策略约束）用的是 ② 和 ③：</text>
<text x="20" y="250" fill="#252d25">② 经 R12 的 AS3 AS7 AS11 AS19 有 4 个 AS，淘汰；经 R11、R13 的都是 3 个，打平。</text>
<text x="20" y="274" fill="#252d25">③ R14 经 R11 出 AS1 只要 1 跳，经 R13 要 2 跳（中间过 R15），所以 R14 的下一跳是 R11。</text>
<text x="20" y="306" fill="#6c7166" font-size="12">来源：湖科大教书匠 2024 真题讲解 47 题（规则 ①～④，引谢希仁第 8 版）；王道第 4.4 节只写了 ② 和 ③。</text>
</svg>
