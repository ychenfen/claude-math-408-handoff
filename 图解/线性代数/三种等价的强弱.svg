<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="行组等价、列组等价都比矩阵等价强；矩阵等价只要求秩相等" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="13"><title>行组等价、列组等价都比矩阵等价强；矩阵等价只要求秩相等</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b9183"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3f6b2c"/></marker></defs>
<rect x="30" y="30" width="250" height="64" rx="8" fill="#f3f6ec" stroke="#3f6b2c" stroke-width="2"/><text x="155.0" y="56.0" text-anchor="middle" font-weight="600" fill="#252d25">行向量组等价</text><text x="155.0" y="75.0" text-anchor="middle" font-size="12" fill="#6b7163">Ax=0 与 Bx=0 同解</text><rect x="360" y="30" width="250" height="64" rx="8" fill="#ffffff" stroke="#8b9183" stroke-width="1.25"/><text x="485.0" y="56.0" text-anchor="middle" font-weight="600" fill="#252d25">列向量组等价</text><text x="485.0" y="75.0" text-anchor="middle" font-size="12" fill="#6b7163">Aᵀy=0 与 Bᵀy=0 同解</text><rect x="195" y="176" width="250" height="64" rx="8" fill="#ffffff" stroke="#8b9183" stroke-width="1.25"/><text x="320.0" y="202.0" text-anchor="middle" font-weight="600" fill="#252d25">矩阵等价</text><text x="320.0" y="221.0" text-anchor="middle" font-size="12" fill="#6b7163">同型且秩相等（A=PBQ）</text><text x="155" y="114" text-anchor="middle" font-size="12" font-weight="600" fill="#3f6b2c">A=PB（P 可逆）</text><text x="485" y="114" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7163">A=BQ（Q 可逆）</text><path d="M155 96L262 174" fill="none" stroke="#8b9183" stroke-width="1.25" marker-end="url(#a)"/><path d="M485 96L378 174" fill="none" stroke="#8b9183" stroke-width="1.25" marker-end="url(#a)"/><text x="208" y="148" text-anchor="end" font-size="12" font-weight="400" fill="#6b7163">能推出</text><text x="432" y="148" text-anchor="start" font-size="12" font-weight="400" fill="#6b7163">能推出</text><text x="320" y="266" text-anchor="middle" font-size="12" font-weight="600" fill="#9a3b26">反推不成立：A=(1,0)、B=(0,1) 秩相等，但 Ax=0 与 Bx=0 不同解</text><text x="320" y="18" text-anchor="middle" font-size="13" font-weight="600" fill="#252d25">左乘管行，右乘管列</text>
</svg>
