<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 940" role="img" aria-label="2024-18 访存流程：TLB、页表、权限检查在 MMU 内，Cache 在得到物理地址之后" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><title>2024-18 一次访存流程：MMU 地址转换与 Cache</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="26" text-anchor="middle" font-size="14" fill="#222" font-weight="700">一次访存：先翻译（MMU），再取数（Cache）</text><rect x="150" y="44" width="300" height="52" rx="6" fill="#f4f4f4" stroke="#555" stroke-width="1.5"/><text x="300.0" y="66.0" text-anchor="middle" font-size="14" fill="#222" font-weight="700">CPU 给出虚拟地址</text><text x="300.0" y="84.0" text-anchor="middle" font-size="12" fill="#555">虚页号 ｜ 页内地址</text><rect x="16" y="116" width="876" height="520" rx="10" fill="none" stroke="#4a6aa5" stroke-width="1.5" stroke-dasharray="6 4"/><text x="30" y="138" text-anchor="start" font-size="14" fill="#4a6aa5" font-weight="700">MMU 地址转换（得到物理地址之前）</text><path d="M300 96V158" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/><polygon points="300,158 425,192 300,226 175,192" fill="#eaf0fa" stroke="#4a6aa5" stroke-width="1.5"/><text x="300" y="188" text-anchor="middle" font-size="14" fill="#222" font-weight="700">查 TLB</text><text x="300" y="206" text-anchor="middle" font-size="12" fill="#555">命中？</text><path d="M425 192H522" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/><text x="470" y="184" text-anchor="middle" font-size="12" fill="#555">否</text><rect x="525" y="166" width="330" height="52" rx="6" fill="#fbeaea" stroke="#b04040" stroke-width="1.5"/><text x="690.0" y="188.0" text-anchor="middle" font-size="14" fill="#222" font-weight="700">D. TLB 缺失</text><text x="690.0" y="206.0" text-anchor="middle" font-size="12" fill="#555">改去主存查页表</text><path d="M690 218V248" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/><rect x="525" y="250" width="330" height="44" rx="6" fill="#f4f4f4" stroke="#555" stroke-width="1.5"/><text x="690.0" y="277.0" text-anchor="middle" font-size="14" fill="#222" font-weight="700">读出页表项</text><path d="M690 294V318" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/><polygon points="690,318 840,352 690,386 540,352" fill="#eaf0fa" stroke="#4a6aa5" stroke-width="1.5"/><text x="690" y="348" text-anchor="middle" font-size="14" fill="#222" font-weight="700">有效位 = 1？</text><text x="690" y="366" text-anchor="middle" font-size="12" fill="#555">这页在不在主存</text><path d="M690 386V414" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/><text x="704" y="404" text-anchor="start" font-size="12" fill="#555">否</text><rect x="525" y="416" width="330" height="64" rx="6" fill="#fbeaea" stroke="#b04040" stroke-width="1.5"/><text x="690.0" y="435.0" text-anchor="middle" font-size="14" fill="#222" font-weight="700">C. 页面缺失（缺页异常）</text><text x="690.0" y="453.0" text-anchor="middle" font-size="12" fill="#555">OS 从磁盘调页、改页表</text><text x="690.0" y="471.0" text-anchor="middle" font-size="12" fill="#555">返回后重新执行这条指令</text><path d="M855 448H880V136H300V156" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/><path d="M540 352H303" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/><text x="422" y="344" text-anchor="middle" font-size="12" fill="#555">是：表项装入 TLB</text><path d="M300 226V476" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/><text x="312" y="262" text-anchor="start" font-size="12" fill="#555">是</text><polygon points="300,478 440,512 300,546 160,512" fill="#eaf0fa" stroke="#4a6aa5" stroke-width="1.5"/><text x="300" y="508" text-anchor="middle" font-size="14" fill="#222" font-weight="700">权限位允许？</text><text x="300" y="526" text-anchor="middle" font-size="12" fill="#555">读/写/执行、用户/内核</text><path d="M440 512H522" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/><text x="478" y="504" text-anchor="middle" font-size="12" fill="#555">否</text><rect x="525" y="490" width="330" height="44" rx="6" fill="#fbeaea" stroke="#b04040" stroke-width="1.5"/><text x="690.0" y="517.0" text-anchor="middle" font-size="14" fill="#222" font-weight="700">A. 访问越权 → 异常</text><path d="M300 546V570" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/><text x="312" y="562" text-anchor="start" font-size="12" fill="#555">是</text><rect x="150" y="572" width="300" height="48" rx="6" fill="#edf5ea" stroke="#4d8a3a" stroke-width="1.5"/><text x="300.0" y="601.0" text-anchor="middle" font-size="14" fill="#222" font-weight="700">物理地址 = 页框号 ｜ 页内地址</text><text x="640" y="662" text-anchor="middle" font-size="12" fill="#555">MMU 到此结束，下面用的已经是物理地址</text><rect x="16" y="676" width="876" height="200" rx="10" fill="none" stroke="#4d8a3a" stroke-width="1.5" stroke-dasharray="6 4"/><text x="30" y="698" text-anchor="start" font-size="14" fill="#4d8a3a" font-weight="700">用物理地址访存（得到物理地址之后）</text><path d="M300 620V710" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/><polygon points="300,710 425,744 300,778 175,744" fill="#edf5ea" stroke="#4d8a3a" stroke-width="1.5"/><text x="300" y="740" text-anchor="middle" font-size="14" fill="#222" font-weight="700">查 Cache</text><text x="300" y="758" text-anchor="middle" font-size="12" fill="#555">命中？</text><path d="M425 744H522" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/><text x="470" y="736" text-anchor="middle" font-size="12" fill="#555">否</text><rect x="525" y="720" width="330" height="52" rx="6" fill="#fbeaea" stroke="#b04040" stroke-width="1.5"/><text x="690.0" y="742.0" text-anchor="middle" font-size="14" fill="#222" font-weight="700">B. Cache 缺失</text><text x="690.0" y="760.0" text-anchor="middle" font-size="12" fill="#555">从主存把整块调入 Cache</text><path d="M690 772V834H453" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/><path d="M300 778V814" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/><text x="312" y="800" text-anchor="start" font-size="12" fill="#555">是</text><rect x="150" y="816" width="300" height="44" rx="6" fill="#f4f4f4" stroke="#555" stroke-width="1.5"/><text x="300.0" y="843.0" text-anchor="middle" font-size="14" fill="#222" font-weight="700">数据送 CPU</text><rect x="16" y="892" width="876" height="40" rx="6" fill="#fdf4e3" stroke="#b07a20" stroke-width="1.5"/><text x="454.0" y="917.0" text-anchor="middle" font-size="14" fill="#222" font-weight="700">答案 B：A、C、D 都在 MMU 翻译时发现；Cache 缺失要等拿到物理地址、查了 Cache 才知道</text></svg>
