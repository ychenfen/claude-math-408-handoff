<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-label="2009-44 单总线数据通路示意：存储器经系统总线 AB、DB 与 MAR、MDR 相连，CPU 内部单总线连接 MAR、MDR、R0、R1、A、ALU、AC、PC" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="13"><title>2009-44 单总线数据通路（重绘示意）</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#333"/></marker></defs>
